{% extends 'attendance/base.html' %}
  <script src="https://cdn.tailwindcss.com"></script>


{% block content %}
<div class="max-w-3xl mx-auto mt-10 px-4">

    <h2 class="text-3xl font-bold text-center text-indigo-600 mb-4">
        Mark Attendance
    </h2>

    <p class="text-center text-gray-700 mb-8">
        Date: <strong class="text-indigo-500">{{ today }}</strong>
    </p>

    <form method="post" class="bg-white shadow-lg rounded-xl p-6">
        {% csrf_token %}

        {% for s in students %}
        <div class="flex items-center justify-between p-3 mb-3 rounded-lg bg-gray-50 hover:bg-indigo-50 transition">
            
            <span class="text-lg font-medium text-gray-800">
                {{ s.name }}
            </span>

            <input
                type="checkbox"
                name="{{ s.id }}"
                checked
                class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500"
            >
        </div>
        {% empty %}
        <p class="text-center text-gray-500">
            No students available
        </p>
        {% endfor %}

        <div class="text-center mt-6">
            <button
                type="submit"
                class="px-6 py-2 text-white font-semibold rounded-lg
                       bg-indigo-600 hover:bg-indigo-700 transition shadow-md"
            >
                Submit Attendance
            </button>
        </div>
    </form>

</div>
{% endblock %}
