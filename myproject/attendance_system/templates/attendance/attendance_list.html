{% extends 'attendance/base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto mt-10 px-4">

    <h2 class="text-3xl font-bold text-center text-indigo-600 mb-8">
        Attendance Records
    </h2>

    {% for r in records %}
    <div class="flex justify-between items-center p-4 mb-4 rounded-xl shadow-md
        {% if r.present %}
            bg-green-100 border-l-8 border-green-500
        {% else %}
            bg-red-100 border-l-8 border-red-500
        {% endif %}
    ">

        <div>
            <p class="text-lg font-semibold text-gray-800">
                {{ r.Student.name }}
            </p>
            <p class="text-sm text-gray-600">
                {{ r.date }}
            </p>
        </div>

        {% if r.present %}
            <span class="px-4 py-1 rounded-full text-sm font-bold bg-green-500 text-white">
                Present
            </span>
        {% else %}
            <span class="px-4 py-1 rounded-full text-sm font-bold bg-red-500 text-white">
                Absent
            </span>
        {% endif %}
    </div>

    {% empty %}
    <p class="text-center text-gray-500 text-lg mt-10">
        No attendance records found.
    </p>
    {% endfor %}

</div>
{% endblock %}
